name: Publish release to R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release GitHub à republier (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
      RELEASE_ASSETS_DIR: release-assets
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the frozen GitHub release
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_ASSETS_DIR"

      - name: Validate release assets
        run: node scripts/validate-release-assets.mjs "$RELEASE_TAG"

      - name: Publish binaries, stable aliases, then manifests
        run: bash scripts/publish-release-to-r2.sh
